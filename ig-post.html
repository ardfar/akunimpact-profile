<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>

    <style>
        @font-face {
            font-family: 'sifonn';
            src: url('assets/fonts/sifonn-basic.otf');
        }
        .glow {
            color: #fff;
            text-shadow: 0 0 50px white;
        }
    </style>
</head>
<body class="font-[sifonn]">
    <div class="grid grid-cols-12">
        <div class="col-span-6 w-full h-fit">
            <div class="block bg-[url('assets/images/template-ig.png')] bg-contain w-[1920px] h-[1920px] scale-[0.3] origin-top-left ">

            </div>
        </div>
        <div class="col-span-6 w-full h-fit">
            <div class="relative w-[1920px] h-[1920px] scale-[0.3] origin-top-left border-2 border-black border-solid">
                <!-- Wavy background  -->
                <div class="absolute top-0 left-0 w-full h-full bg-[url('assets/images/wavy-ig.svg')] z-0"></div>

                <!-- Upper bar  -->
                <div class="fixed top-0 left-0 flex items-center justify-center w-full h-fit px-4 my-8 z-10">
                    <div class="w-1/5 text-[#4086a2] text-[30px] flex items-center justify-center uppercase tracking-[.3em]">
                        new
                    </div>
                    <div class="w-3/5 text-white bg-[#4086a2] py-4 rounded-full text-[32px] flex items-center justify-center uppercase tracking-[.3em]">
                        <p class="pb-2">
                            <span class="text-[35px]">✦</span>
                            @AkunImpact | t.me/akunimpact 
                            <span class="text-[35px]">✦</span>
                        </p>
                    </div>
                    <div class="w-1/5 text-[#4086a2] text-[30px] flex items-center justify-center uppercase tracking-[.3em]">
                        swipe>>>
                    </div>
                </div>
        
                <!-- Text place holder background  -->
                <div class="absolute bottom-0 left-0 w-full h-2/5 bg-[#4086a2] z-10 flex flex-col">
                    <div class="w-full text-center text-white text-[60px] mt-28 glow">
                        G-AAA-00378
                    </div>
                    <div class="w-full text-center text-white text-[180px] tracking-[0.2em] leading-[11rem] glow">
                        560K
                    </div>
                    <div class="w-full text-center text-white text-[45px] uppercase mt-12 glow">
                        Ganyu C0, Neuvilette C2, Jean C5
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
